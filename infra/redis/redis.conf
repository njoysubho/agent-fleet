# Redis persistence + safe defaults for local dev.
bind 0.0.0.0
port 6379

# In Docker we rely on network isolation; keep protected-mode off.
protected-mode no

# Store data under mounted volume.
dir /data

# Prefer AOF persistence for Streams/Hashes durability.
appendonly yes
appendfsync everysec

# Disable periodic RDB snapshots to reduce IO.
save ""
